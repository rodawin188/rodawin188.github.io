<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:A2rial,Helvetica,sans-serif}
body{
  background:linear-gradient(135deg,#090909,#181818,#080808);
  color:#fff;display:flex;justify-content:center;
}
.wrap{width:100%;max-width:680px;padding:30px 16px 40px;text-align:center}
.profile{display:flex;flex-direction:column;align-items:center}
.avatar{
  width:100px;height:100px;border-radius:50%;object-fit:cover;
  border:3px solid #fff;box-shadow:0 8px 28px rgba(0,0,0,.5);
}
.name{font-size:24px;font-weight:800;margin:15px 0 5px}
.handle{font-size:14px;color:#aaa;margin-bottom:8px}
.bio{font-size:14px;color:#ddd;line-height:1.5;margin:0 auto 23px}
.links{display:flex;flex-direction:column;gap:13px}
.link{
  min-height:58px;display:flex;align-items:center;justify-content:center;
  position:relative;padding:14px 48px;border-radius:15px;
  text-decoration:none;color:#111;background:#fff;
  font-size:16px;font-weight:700;
  box-shadow:0 5px 18px rgba(0,0,0,.25);
  transition:.18s ease;
}
.link:hover{transform:translateY(-2px)}
.link:active{transform:scale(.98)}
.red{background:#e50909;color:#fff}
.dark{background:#242424;color:#fff}
.gold{background:#f2b300;color:#111}
.icon{position:absolute;left:17px;font-size:20px}
.more{position:absolute;right:16px;color:#777;letter-spacing:2px}
.banner{
  width:100%;display:block;margin-top:24px;border-radius:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.4);
}
.footer{margin-top:20px;color:#777;font-size:12px}
</style>

</head>
